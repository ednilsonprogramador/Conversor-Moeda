<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./Style.css">
    
    <title>Conversor de Moedas</title>
</head>

<body>

    <img src="./img//Logo.jpg" alt="Logo do Conversor de Moedas" class="logo">


    <main>
        <label>
            Converter <b>de</b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>


        <label>
            Converter <b>para</b>
            <select class="selecao-moeda">
                <option value="dolar">US$ Dólar Americano</option>            
                <option value="euro">€ Euro </option>
                <option value="yuan">¥ Yuan </option>
            </select>
        </label>

        Valor a ser convertido
        <input class="currency-input" placeholder="Digite o valor">

        <button class="convertbutton">Converter</button>

        <section>
            <div class="moeda-container">
                <img src="./img/Real.jpg" alt="moeda Real a ser convertida" height="40px" width="40px">
                <p class="currency">Real</p>
                <p class="valor-a-ser-convertido">R$ 0,00</p>
            </div>

            <img src="./img/Seta.jpg" alt="seta" height="40px" class="seta-image">

            <div class="moeda-container">
                <img class="currency-img" src="./img/Dolar.jpg" alt="moeda Dólar Americano convertida" height="40px">
                <p class="nome-moeda">Dólar Americano</p>
                <p class="valor-convertido">US$ 0.00</p>
            </div>
        </section>
    </main>
</body>
<script src="./script.js"></script>
</html>
